<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS 1.8 Radiation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      width: 1280px;
      height: 720px;
      max-width: 100%;
      max-height: 100vh;
    }
    canvas {
      display: block;
    }
    .lobby-panel {
      width: 280px;
      font-family: Arial, sans-serif;
    }
    .lobby-input {
      width: 100%;
      height: 46px;
      border: 2px solid #6f805f;
      border-radius: 4px;
      outline: none;
      background: #101510;
      color: #e8f3d0;
      font-size: 20px;
      text-align: center;
      padding: 0 14px;
    }
    .lobby-input::placeholder {
      color: #7e8d76;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
