<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS 1.8 Radiation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }
    body {
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      inset: 0;
      min-height: 100%;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      image-rendering: pixelated;
    }
    .lobby-panel {
      width: 280px;
      max-width: calc(100vw - 32px);
      font-family: Arial, sans-serif;
    }
    .lobby-input {
      width: 100%;
      height: 46px;
      border: 2px solid #6f805f;
      border-radius: 4px;
      outline: none;
      background: #101510;
      color: #e8f3d0;
      font-size: 20px;
      text-align: center;
      padding: 0 14px;
    }
    .lobby-input::placeholder {
      color: #7e8d76;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
